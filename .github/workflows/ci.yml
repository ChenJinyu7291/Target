name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install base and test dependencies
        # Base + test extras only; omics-heavy extras are not installed in CI.
        run: python -m pip install -e ".[test]"
      - name: Repository policy check
        run: python scripts/repo_policy_check.py
      - name: Pytest
        # No real network or LLM calls; capability-gated tests skip naturally.
        run: python -m pytest -q
